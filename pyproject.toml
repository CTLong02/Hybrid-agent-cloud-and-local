[project]
name = "hybrid-agent"
version = "0.1.0"
description = "Hybrid coding agent: Claude planner/reviewer + local Qwen workers"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.7",
    "structlog>=24.1",
    "tenacity>=8.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    # Claude Code SDK - uses local `claude` CLI auth, no API key
    "claude-agent-sdk>=0.0.10",
]

[project.optional-dependencies]
tui = [
    "textual>=0.58",
]
webui = [
    "streamlit>=1.32",
    "pandas>=2.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
hybrid-agent = "hybrid_agent.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hybrid_agent*"]

[tool.setuptools.package-data]
hybrid_agent = ["prompts/*.md", "webui/*.py", "webui/pages/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:jose.*",
    "ignore::pytest.PytestCollectionWarning",
]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that hit real LLMs or other external services",
]

[tool.coverage.run]
source = ["hybrid_agent"]
branch = true
omit = [
    "hybrid_agent/__main__.py",
    "hybrid_agent/cli.py",
    "hybrid_agent/parsers/word.py",
    "hybrid_agent/parsers/excel.py",
    "hybrid_agent/task_generator.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
fail_under = 80

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8 / isort / black)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "workspace",                # generated code lives here, don't lint it
    "merged",
    "hybrid_agent.egg-info",
]

[tool.ruff.lint]
# Curated rule set: errors + warnings + obvious bugs + import sorting +
# pyupgrade. Keeps signal high without nitpicking style.
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes (unused imports, undefined names, ...)
    "I",     # isort (import order)
    "B",     # flake8-bugbear (likely bugs: mutable defaults, etc.)
    "UP",    # pyupgrade (modern syntax)
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
]
ignore = [
    "E501",   # line too long — handled by formatter, not worth blocking on
    "B008",   # function call in default arg — Pydantic Field() is idiomatic
    "SIM108", # ternary vs if/else — sometimes if is clearer
]

[tool.ruff.lint.per-file-ignores]
# Tests use long parametrize tables, fixtures with unused-looking args, etc.
"tests/**" = ["E402", "F401", "F811"]
# `_smoke_*.py` are throwaway scripts
"_smoke_*.py" = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy — static type checking (default mode: only check annotated code)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
# Default mode: only checks bodies of functions that have type annotations.
# Bumping to strict needs systematic annotation work first.
check_untyped_defs = false
# Pydantic v2 plugin gives proper validation of model fields.
plugins = ["pydantic.mypy"]
exclude = [
    '^tests/',
    '^workspace/',
    '^merged/',
    '^_smoke_',
]

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_missing_imports = true
